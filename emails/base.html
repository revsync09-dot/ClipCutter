<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>[[subject]]</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0; mso-table-rspace:0; }
    table { border-collapse:collapse; }
    img { border:0; outline:none; text-decoration:none; }
    a { color:#c4b5fd; }
    @media only screen and (max-width:600px) {
      .outer { padding:16px 10px !important; }
      .pad { padding-left:24px !important; padding-right:24px !important; }
      .hero { font-size:34px !important; line-height:40px !important; letter-spacing:-1.2px !important; }
      .brand { font-size:25px !important; }
      .feature { font-size:11px !important; line-height:17px !important; }
      .code { font-size:30px !important; letter-spacing:6px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#111115;color:#f5f5f7;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">[[preheader]]</div>
  <table role="presentation" width="100%" bgcolor="#111115" style="width:100%;background-color:#111115;">
    <tr><td class="outer" align="center" style="padding:36px 16px;">
      <!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
      <table role="presentation" width="100%" style="width:100%;max-width:600px;border-collapse:separate;border-spacing:0;">
        <tr><td style="background-color:#18181d;border:1px solid #303037;border-radius:16px;overflow:hidden;">
          <table role="presentation" width="100%">
            <tr><td class="pad" style="padding:30px 40px;border-bottom:1px solid #303037;">
              <table role="presentation" width="100%"><tr>
                <td width="40" align="left">[[clapper]]</td>
                <td class="brand" align="center" style="font-size:29px;line-height:34px;font-weight:800;letter-spacing:-1px;color:#f5f5f7;">Clip<span style="color:#b9a0ff;">Forge</span></td>
                <td width="40" align="right">[[play]]</td>
              </tr></table>
            </td></tr>
            <tr><td class="pad" align="center" style="padding:39px 40px 0;font-size:10px;line-height:16px;letter-spacing:2px;font-weight:bold;color:#b9a0ff;">[[eyebrow]]</td></tr>
            <tr><td class="pad" align="center" style="padding:18px 40px 0;">
              <h1 class="hero" style="margin:0;color:#f5f5f7;font-size:44px;line-height:50px;letter-spacing:-1.7px;font-weight:700;">[[headline]]</h1>
            </td></tr>
            <tr><td class="pad" align="center" style="padding:20px 40px 0;font-size:16px;line-height:26px;color:#bcbcc7;">[[body]]</td></tr>
            <tr><td class="pad" align="center" style="padding:28px 40px 0;">[[action]]</td></tr>
            <tr><td class="pad" align="center" style="padding:18px 40px 32px;font-size:12px;line-height:19px;color:#9999a7;">[[note]]</td></tr>
            [[features]]
            <tr><td class="pad" align="center" style="padding:27px 40px;border-top:1px solid #303037;font-size:12px;line-height:20px;color:#a5a5b2;">[[security]]</td></tr>
          </table>
        </td></tr>
        <tr><td class="pad" align="center" style="padding:24px 40px 0;font-size:11px;line-height:19px;color:#9999a7;">[[fallback]]</td></tr>
        <tr><td class="pad" align="center" style="padding:27px 40px 0;font-size:12px;line-height:20px;color:#9999a7;">ClipForge &nbsp;&middot;&nbsp; <a href="mailto:clipforge160@gmail.com" style="color:#bcbcc7;text-decoration:underline;">Get help</a></td></tr>
        <tr><td align="center" style="padding:9px 20px 0;font-size:9px;line-height:16px;letter-spacing:2px;color:#888895;">BIGGER IDEAS. SHORTER CUTS.</td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
